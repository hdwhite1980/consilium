name: Backtest Outcomes Resolver (1w + 1m)

# Resolves 1-week and 1-month outcomes by fetching daily OHLC bars from
# Alpaca (replaced Finnhub /candle which moved behind the paid tier).
#
# Schedule: Daily at 4:30am ET
#   - During DST (Mar-Nov): 4:30 ET = 8:30 UTC
#   - During standard time (Nov-Mar): 4:30 ET = 9:30 UTC
#   We schedule for 8:30 UTC year-round. In standard-time months, the
#   job runs at 3:30 ET instead of 4:30 ET — still well before market open.
#
# Why this time:
#   - Markets closed; price data settled
#   - Before any pre-market analysis cron jobs
#   - User wakes up to fresh resolved outcomes
#
# 1-day outcomes are handled by a SEPARATE workflow that runs in the
# afternoon, since same-day verdicts need market hours to play out.

on:
  schedule:
    - cron: '30 8 * * *'   # daily, 8:30 UTC = 4:30 ET DST / 3:30 ET standard
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  resolve-backtest-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger backtest outcomes resolver (1w + 1m)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET not configured in GitHub secrets"
            exit 1
          fi

          echo "Triggering backtest outcomes resolver (1w + 1m) at $(date -u)"

          # Use horizon=all to resolve every horizon (1d included if any
          # 1d verdicts haven't been picked up by the afternoon cron yet).
          response=$(curl -sS -w "\n__HTTP_STATUS:%{http_code}__" \
            --max-time 300 \
            -X POST "https://wali-os.com/api/backtest/outcomes?horizon=all" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json")

          body=$(echo "$response" | sed 's/__HTTP_STATUS:[0-9]*__$//')
          status=$(echo "$response" | grep -o '__HTTP_STATUS:[0-9]*__' | grep -o '[0-9]*')

          echo "HTTP Status: $status"
          echo "Response body:"
          echo "$body"

          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "::error::Backtest outcomes resolver failed with status $status"
            exit 1
          fi

          echo "✓ Backtest outcomes resolver completed"
          echo "::notice::Check Supabase verdict_log for updated outcome_*_strict values"
