name: auto-trade-forex-cron
on:
  schedule:
    # Forex: Sunday 22:00 UTC → Friday 22:00 UTC (24/5)
    # Cover every 10 min during open hours.
    # Cron doesn't have a "weekday-range-with-hour-cutoff" syntax, so we use:
    #   Sun 22-23 + Mon-Thu 0-23 + Fri 0-21 = 5-day continuous window
    - cron: '*/10 22-23 * * 0'      # Sunday from 22:00 UTC
    - cron: '*/10 * * * 1-4'        # Mon-Thu all day
    - cron: '*/10 0-21 * * 5'       # Fri until 22:00 UTC
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hit auto-trade-forex endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          # Normalize APP_BASE_URL: prepend https:// if scheme missing, strip trailing slash
          BASE="${APP_BASE_URL%/}"
          case "$BASE" in
            http://*|https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          response=$(curl -s -L -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/auto-trade-forex" \
            --max-time 70)
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" -ne 200 ]; then
            echo "::error::auto-trade-forex returned non-200 status: $status"
            exit 1
          fi
