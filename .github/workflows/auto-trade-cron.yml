name: auto-trade-cron

on:
  schedule:
    # Every 5 minutes during US market hours (9:30 AM - 4:00 PM ET = 13:30-20:00 UTC)
    # Cron is in UTC. Trim to weekdays.
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hit auto-trade endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          response=$(curl -s -L -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/auto-trade" \
            --max-time 70)
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" -ne 200 ]; then
            echo "::error::auto-trade returned non-200 status: $status"
            exit 1
          fi
