name: auto-trade-positions-cron

on:
  schedule:
    # Session 3a: tightened from 15 min → 5 min for target-hit responsiveness.
    # Crypto runs 24/7; equity confined to market hours + after-hours buffer.
    # We run 24/7 here so crypto positions get target/stop checks all the time;
    # equity branch is a no-op outside market hours since no positions update.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hit auto-trade-positions endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          # Normalize APP_BASE_URL: prepend https:// if scheme missing, strip trailing slash
          BASE="${APP_BASE_URL%/}"
          case "$BASE" in
            http://*|https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          response=$(curl -s -L -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/auto-trade-positions" \
            --max-time 70)
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" -ne 200 ]; then
            echo "::error::auto-trade-positions returned non-200 status: $status"
            exit 1
          fi
